<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" fill="none">
<title>Recipe import workflow</title><desc>PWA source and consent enter authenticated upload and the durable import queue. Complete website recipe metadata can go directly to a draft. Missing metadata and supported media use AI with consent, then schema validation. The user reviews and confirms the draft before transactional recipe sync.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#657064" stroke-width="1.2"/></marker></defs>
<g stroke="#657064" stroke-width="1.4" marker-end="url(#arrow)"><path d="M180 242h25V112h30"/><path d="M180 250h55"/><path d="M325 146v70"/><path d="M415 250h55"/><path d="M415 235l55-104"/><path d="M570 216v-70"/><path d="M670 112h50"/><path d="M825 146v70"/><path d="M670 250h50"/><path d="M825 284v126"/></g>
<g fill="#fffefb" stroke="#dddfd3"><rect x="20" y="216" width="160" height="68" rx="10"/><rect x="235" y="78" width="180" height="68" rx="10"/><rect x="235" y="216" width="180" height="68" rx="10"/><rect x="470" y="216" width="200" height="68" rx="10"/><rect x="470" y="78" width="200" height="68" rx="10"/><rect x="720" y="78" width="210" height="68" rx="10"/></g>
<g fill="#e9eddf" stroke="#dddfd3"><rect x="720" y="216" width="210" height="68" rx="10"/><rect x="720" y="410" width="210" height="68" rx="10"/></g>
<g fill="#29392e" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><text x="100" y="244">PWA source<tspan x="100" dy="21">+ explicit consent</tspan></text><text x="325" y="106">Authenticated<tspan x="325" dy="21">private upload</tspan></text><text x="325" y="244">SQLite durable<tspan x="325" dy="21">import queue</tspan></text><text x="570" y="244">Website Schema.org<tspan x="570" dy="21">Recipe metadata</tspan></text><text x="570" y="106">Common AI<tspan x="570" dy="21">provider interface</tspan></text><text x="825" y="106">Bounded neutral<tspan x="825" dy="21">schema validation</tspan></text><text x="825" y="255">Editable preview</text><text x="825" y="437">Transactional recipe<tspan x="825" dy="21">+ sync APIs</tspan></text></g>
<g fill="#657064" font-family="Arial,sans-serif" font-size="12"><text x="422" y="169" transform="rotate(-62 422 169)">Image / PDF / video</text><text x="581" y="171">Missing / unstructured</text><text x="581" y="188">+ consent</text><text x="678" y="236">Complete</text><text x="840" y="337">User edits</text><text x="840" y="355">+ confirms</text></g>
</svg>
